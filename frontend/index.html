<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shazam mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #eaf4ff;
        --bg-mid: #ffffff;
        --accent: #0a84ff;
        --accent-glow: #4fa8ff;
        --accent-soft: rgba(10, 132, 255, 0.15);
        --text-primary: #0b1a33;
        --text-secondary: #5c7092;
        --danger: #ff5c72;
        --success: #16a37e;
        --card: #ffffff;
        --border: #cfe2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 60%);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        justify-content: center;
    }

    .app {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px 20px 12px;
    }

    header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent-glow);
    }

    header h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
    }

    main {
        flex: 1;
        padding: 0 24px 100px;
        display: flex;
        flex-direction: column;
    }

    /* ---------- SEARCH VIEW ---------- */
    .search-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 8px;
    }

    .search-view h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 600;
    }

    .search-view p {
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 36px;
    }

    .mic-wrap {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
    }

    .mic-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid var(--accent-soft);
        animation: none;
    }

    .mic-ring.pulsing {
        animation: pulse 1.6s ease-out infinite;
    }
    .mic-ring:nth-child(2).pulsing { animation-delay: 0.4s; }
    .mic-ring:nth-child(3).pulsing { animation-delay: 0.8s; }

    @keyframes pulse {
        0%   { transform: scale(0.75); opacity: 0.8; }
        100% { transform: scale(1.35); opacity: 0; }
    }

    #recordBtn {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background: linear-gradient(145deg, var(--accent-glow), var(--accent) 70%);
        box-shadow: 0 0 40px rgba(10, 132, 255, 0.35), inset 0 0 20px rgba(255,255,255,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease;
        z-index: 1;
    }

    #recordBtn:active { transform: scale(0.94); }

    #recordBtn.recording {
        background: linear-gradient(145deg, #ff6f7f, var(--danger) 70%);
        box-shadow: 0 0 40px rgba(255, 92, 114, 0.5), inset 0 0 20px rgba(255,255,255,0.15);
    }

    #recordBtn svg { width: 44px; height: 44px; }

    .status-text {
        font-size: 14px;
        color: var(--text-secondary);
        min-height: 20px;
    }

    .status-text.success { color: var(--success); }
    .status-text.error { color: var(--danger); }

    .result-card {
        margin-top: 28px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        display: none;
        align-items: center;
        gap: 14px;
        text-align: left;
        box-shadow: 0 4px 20px rgba(10, 132, 255, 0.08);
    }

    .result-card.show { display: flex; }

    .result-art {
        width: 54px;
        height: 54px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #5cc8ff);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 22px;
        overflow: hidden;
    }

    .result-art img,
    .song-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
    }

    .result-info h3 { font-size: 16px; font-weight: 600; }
    .result-info p { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .result-info .score { font-size: 11px; color: var(--accent); margin-top: 4px; }

    /* ---------- LIBRARY VIEW ---------- */
    .library-view { display: none; padding-top: 24px; }
    .library-view.show { display: block; }

    .library-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .library-header h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
    }

    .count-pill {
        font-size: 12px;
        color: var(--text-secondary);
        background: var(--card);
        border: 1px solid var(--border);
        padding: 4px 10px;
        border-radius: 20px;
    }

    #addSongBtn {
        margin: 16px 0 20px;
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        border: 1px dashed var(--border);
        background: transparent;
        color: var(--accent);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
    }

    .song-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }

    .song-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .song-details { flex: 1; min-width: 0; }
    .song-details .t { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-details .a { font-size: 12px; color: var(--text-secondary); }

    .delete-btn {
        background: none;
        border: none;
        color: var(--danger);
        font-size: 12px;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 8px;
    }
    .delete-btn:hover { background: rgba(255, 92, 114, 0.1); }

    .empty-msg {
        text-align: center;
        color: var(--text-secondary);
        font-size: 13px;
        padding: 40px 0;
    }

    /* ---------- BOTTOM NAV ---------- */
    nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 480px;
        display: flex;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        padding: 10px 0 18px;
    }

    .nav-btn {
        flex: 1;
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 11px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
    }

    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 20px; height: 20px; }

    /* ---------- MODAL (Add song) ---------- */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 26, 51, 0.35);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 10;
    }
    .modal-overlay.show { display: flex; }

    .modal {
        width: 100%;
        max-width: 480px;
        background: var(--bg-mid);
        border: 1px solid var(--border);
        border-radius: 24px 24px 0 0;
        padding: 24px;
    }

    .modal h3 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        margin-bottom: 16px;
    }

    .field { margin-bottom: 14px; }
    .field label {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 6px;
    }
    .field input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-primary);
        font-size: 14px;
    }
    .field input[type="file"] {
        width: 100%;
        font-size: 13px;
        color: var(--text-secondary);
    }

    .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .btn-primary, .btn-secondary {
        flex: 1;
        padding: 13px;
        border-radius: 12px;
        border: none;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--card); color: var(--text-secondary); border: 1px solid var(--border); }

    .modal-status {
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
        min-height: 18px;
    }
</style>
</head>
<body>

<div class="app">

    <header>
        <div class="dot"></div>
        <h1>SHAZAM</h1>
    </header>

    <main>

        <!-- ============ SEARCH VIEW ============ -->
        <section class="search-view" id="searchView">
            <h2 id="searchTitle">Tap to identify</h2>
            <p id="searchSubtitle">Play a song nearby and we'll find it</p>

            <div class="mic-wrap">
                <div class="mic-ring" id="ring1"></div>
                <div class="mic-ring" id="ring2"></div>
                <div class="mic-ring" id="ring3"></div>
                <button id="recordBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                        <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <div class="status-text" id="statusText">Ready</div>

            <div class="result-card" id="resultCard">
                <div class="result-art" id="resultArt">🎵</div>
                <div class="result-info">
                    <h3 id="resultTitle"></h3>
                    <p id="resultArtist"></p>
                    <p class="score" id="resultScore"></p>
                </div>
            </div>
        </section>

        <!-- ============ LIBRARY VIEW ============ -->
        <section class="library-view" id="libraryView">
            <div class="library-header">
                <h2>Library</h2>
                <div class="count-pill" id="countPill">0 / 500</div>
            </div>

            <button id="addSongBtn">+ Add a song</button>

            <div id="songList"></div>
        </section>

    </main>

    <nav>
        <button class="nav-btn active" data-view="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3zM19 11a7 7 0 01-14 0M12 18v3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Search
        </button>
        <button class="nav-btn" data-view="library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h7" stroke-linecap="round"/></svg>
            Library
        </button>
    </nav>

    <!-- ============ ADD SONG MODAL ============ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>Add a new song</h3>
            <div class="field">
                <label>Title</label>
                <input type="text" id="inputTitle" placeholder="Song title">
            </div>
            <div class="field">
                <label>Artist</label>
                <input type="text" id="inputArtist" placeholder="Artist name">
            </div>
            <div class="field">
                <label>Album (optional)</label>
                <input type="text" id="inputAlbum" placeholder="Album name">
            </div>
            <div class="field">
                <label>Audio file</label>
                <input type="file" id="inputFile" accept="audio/*">
            </div>
            <div class="field">
                <label>Cover image (optional)</label>
                <input type="file" id="inputImage" accept="image/*">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelAdd">Cancel</button>
                <button class="btn-primary" id="confirmAdd">Add song</button>
            </div>
            <div class="modal-status" id="modalStatus"></div>
        </div>
    </div>

</div>

<script>
    const API_URL = "http://127.0.0.1:8000"; // change if backend runs elsewhere

    // ---------- View switching ----------
    const navBtns = document.querySelectorAll(".nav-btn");
    const searchView = document.getElementById("searchView");
    const libraryView = document.getElementById("libraryView");

    navBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            navBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const view = btn.dataset.view;
            searchView.classList.toggle("show", view === "search");
            libraryView.classList.toggle("show", view === "library");
            searchView.style.display = view === "search" ? "flex" : "none";
            libraryView.style.display = view === "library" ? "block" : "none";
            if (view === "library") loadSongs();
        });
    });

    // ---------- Recording ----------
    const recordBtn = document.getElementById("recordBtn");
    const statusText = document.getElementById("statusText");
    const searchTitle = document.getElementById("searchTitle");
    const searchSubtitle = document.getElementById("searchSubtitle");
    const resultCard = document.getElementById("resultCard");
    const resultArt = document.getElementById("resultArt");
    const resultTitle = document.getElementById("resultTitle");
    const resultArtist = document.getElementById("resultArtist");
    const resultScore = document.getElementById("resultScore");
    const rings = [document.getElementById("ring1"), document.getElementById("ring2"), document.getElementById("ring3")];

    let mediaRecorder, audioChunks = [], isRecording = false, autoStopTimer = null;
    const RECORD_SECONDS = 10; // yahan se recording ki lambai badal/ghata sakte hain

    function stopRecording() {
        if (!isRecording) return;
        clearTimeout(autoStopTimer);
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove("recording");
        rings.forEach(r => r.classList.remove("pulsing"));
        searchTitle.textContent = "Identifying...";
        searchSubtitle.textContent = "Hold on a second";
        statusText.textContent = "Processing";
    }

    recordBtn.addEventListener("click", async () => {
        if (isRecording) {
            // Chahein to click karke jaldi bhi rok sakte hain
            stopRecording();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await recognize(blob);
            };
            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add("recording");
            rings.forEach(r => r.classList.add("pulsing"));
            searchTitle.textContent = "Listening...";
            searchSubtitle.textContent = `Recording `;
            statusText.textContent = "Recording";
            statusText.className = "status-text";
            resultCard.classList.remove("show");

            // Khud hi ruk jayega RECORD_SECONDS baad, dobara click ki zaroorat nahi
            autoStopTimer = setTimeout(stopRecording, RECORD_SECONDS * 1000);

        } catch (err) {
            statusText.textContent = "Microphone access denied";
            statusText.className = "status-text error";
        }
    });

    async function recognize(blob) {
        const formData = new FormData();
        formData.append("file", blob, "clip.webm");
        try {
            const res = await fetch(`${API_URL}/recognize`, { method: "POST", body: formData });
            const data = await res.json();

            if (data.status === "found") {
                searchTitle.textContent = "Match found";
                searchSubtitle.textContent = "Here's what's playing";
                statusText.textContent = "Success";
                statusText.className = "status-text success";
                resultTitle.textContent = data.song.title;
                resultArtist.textContent = data.song.artist;
                //resultScore.textContent = `Confidence ${data.song.score}`;
                if (data.song.image_url) {
                    resultArt.innerHTML = `<img src="${data.song.image_url}" alt="cover">`;
                } else {
                    resultArt.innerHTML = "🎵";
                }
                resultCard.classList.add("show");
            } else {
                searchTitle.textContent = "No match found";
                searchSubtitle.textContent = "Try again closer to the audio source";
                statusText.textContent = "Not found";
                statusText.className = "status-text error";
                resultCard.classList.remove("show");
            }
        } catch (err) {
            searchTitle.textContent = "Connection error";
            searchSubtitle.textContent = "Is the backend server running?";
            statusText.textContent = err.message;
            statusText.className = "status-text error";
        }
    }

    // ---------- Library ----------
    const songList = document.getElementById("songList");
    const countPill = document.getElementById("countPill");

    async function loadSongs() {
        songList.innerHTML = `<div class="empty-msg">Loading...</div>`;
        try {
            const [songsRes, countRes] = await Promise.all([
                fetch(`${API_URL}/songs`).then(r => r.json()),
                fetch(`${API_URL}/songs/count`).then(r => r.json())
            ]);
            countPill.textContent = `${countRes.count} / ${countRes.max}`;

            if (songsRes.songs.length === 0) {
                songList.innerHTML = `<div class="empty-msg">No songs yet. Add your first one.</div>`;
                return;
            }

            songList.innerHTML = songsRes.songs.map(s => `
                <div class="song-row" data-id="${s.id}">
                    <div class="song-icon">${s.image_url ? `<img src="${s.image_url}" alt="cover">` : "🎵"}</div>
                    <div class="song-details">
                        <div class="t">${escapeHtml(s.title)}</div>
                        <div class="a">${escapeHtml(s.artist)}</div>
                    </div>
                    <button class="delete-btn" data-id="${s.id}">Delete</button>
                </div>
            `).join("");

            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", () => deleteSong(btn.dataset.id));
            });
        } catch (err) {
            songList.innerHTML = `<div class="empty-msg">Could not reach server.</div>`;
        }
    }

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    async function deleteSong(id) {
        if (!confirm("Delete this song from your library?")) return;
        await fetch(`${API_URL}/songs/${id}`, { method: "DELETE" });
        loadSongs();
    }

    // ---------- Add song modal ----------
    const modalOverlay = document.getElementById("modalOverlay");
    const addSongBtn = document.getElementById("addSongBtn");
    const cancelAdd = document.getElementById("cancelAdd");
    const confirmAdd = document.getElementById("confirmAdd");
    const modalStatus = document.getElementById("modalStatus");

    addSongBtn.addEventListener("click", () => modalOverlay.classList.add("show"));
    cancelAdd.addEventListener("click", () => modalOverlay.classList.remove("show"));

    confirmAdd.addEventListener("click", async () => {
        const title = document.getElementById("inputTitle").value.trim();
        const artist = document.getElementById("inputArtist").value.trim();
        const album = document.getElementById("inputAlbum").value.trim();
        const file = document.getElementById("inputFile").files[0];
        const imageFile = document.getElementById("inputImage").files[0];

        if (!title || !artist || !file) {
            modalStatus.textContent = "Please fill title, artist and choose a file.";
            modalStatus.style.color = "var(--danger)";
            return;
        }

        modalStatus.textContent = "Uploading and fingerprinting... this can take a moment.";
        modalStatus.style.color = "var(--text-secondary)";

        const formData = new FormData();
        formData.append("title", title);
        formData.append("artist", artist);
        formData.append("album", album);
        formData.append("file", file);
        if (imageFile) {
            formData.append("image", imageFile);
        }

        try {
            const res = await fetch(`${API_URL}/songs/add`, { method: "POST", body: formData });
            const data = await res.json();

            if (data.status === "success") {
                modalStatus.textContent = "Song added!";
                modalStatus.style.color = "var(--success)";
                setTimeout(() => {
                    modalOverlay.classList.remove("show");
                    modalStatus.textContent = "";
                    document.getElementById("inputTitle").value = "";
                    document.getElementById("inputArtist").value = "";
                    document.getElementById("inputAlbum").value = "";
                    document.getElementById("inputFile").value = "";
                    document.getElementById("inputImage").value = "";
                    loadSongs();
                }, 900);
            } else {
                modalStatus.textContent = data.message || "Something went wrong.";
                modalStatus.style.color = "var(--danger)";
            }
        } catch (err) {
            modalStatus.textContent = "Could not reach server.";
            modalStatus.style.color = "var(--danger)";
        }
    });
</script>

</body>
</html>
