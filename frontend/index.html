<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Shazam Clone</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #121212;
        color: white;
        text-align: center;
        padding: 50px;
    }
    h1 { color: #1db954; }
    button {
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        margin: 10px;
    }
    #recordBtn { background: #1db954; color: white; }
    #recordBtn.recording { background: #e74c3c; }
    #result {
        margin-top: 30px;
        font-size: 20px;
        min-height: 60px;
    }
    #status { color: #999; }
</style>
</head>
<body>

    <h1>🎵 Shazam Clone</h1>
    <p>Press Button to start Recording</p>

    <button id="recordBtn">🎤 Start Recording</button>

    <div id="status">Ready...</div>
    <div id="result"></div>

    <script>
        // ⚠️ Agar backend kisi doosre address/port pe chal raha ho to yahan badlein
        const API_URL = "http://127.0.0.1:8000";

        const recordBtn = document.getElementById("recordBtn");
        const statusDiv = document.getElementById("status");
        const resultDiv = document.getElementById("result");

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordBtn.addEventListener("click", async () => {
            if (!isRecording) {
                // ===== Recording SHURU karein =====
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        // Recording khatam hote hi, audio ko backend ko bhejein
                        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                        await sendToBackend(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = "⏹️ Stop Recording";
                    recordBtn.classList.add("recording");
                    statusDiv.textContent = "🔴 Recording started...";
                    resultDiv.textContent = "";

                } catch (err) {
                    statusDiv.textContent = "❌ Mic Permission not found: " + err.message;
                }

            } else {
                // ===== Recording ROKEIN =====
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = "🎤 Start Recording";
                recordBtn.classList.remove("recording");
                statusDiv.textContent = "⏳ Song is Recognizing...";
            }
        });

        async function sendToBackend(audioBlob) {
            const formData = new FormData();
            formData.append("file", audioBlob, "clip.webm");

            try {
                const response = await fetch(`${API_URL}/recognize`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                if (data.status === "found") {
                    statusDiv.textContent = "✅ Match Found!";
                    resultDiv.innerHTML = `
                        <strong>${data.song.title}</strong><br>
                        ${data.song.artist}<br>
                        
                    `;
                } else {
                    statusDiv.textContent = "❌ No Match Found";
                    resultDiv.textContent = "This song is not in Database.";
                }
            } catch (err) {
                statusDiv.textContent = "❌ Server not connected.";
                resultDiv.textContent = err.message;
            }
        }
    </script>

</body>
</html>
